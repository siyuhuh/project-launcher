name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4

      - name: Create draft GitHub Release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_body="$(cat <<'EOF'
          ## Download & install

          - macOS Apple Silicon: download the `*_aarch64.dmg` file.
          - macOS Intel: download the `*_x64.dmg` file.
          - Windows: download the `.msi` or `-setup.exe` installer.

          ### Optional terminal command

          - macOS: `curl -fsSL https://raw.githubusercontent.com/siyuhuh/project-launcher/main/scripts/install-cli.sh | bash`
          - Windows PowerShell: `irm https://raw.githubusercontent.com/siyuhuh/project-launcher/main/scripts/install-cli.ps1 | iex`

          The CLI installer downloads the matching `p` binary. No source clone is required.

          macOS desktop builds are ad-hoc signed and not notarized yet. If Gatekeeper blocks the app, see the installation instructions in the repository README.
          EOF
          )"
          if release_id="$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json databaseId --jq '.databaseId' 2>/dev/null)"; then
            echo "Reusing existing draft release ${release_id}"
          else
            release_id="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="${GITHUB_REF_NAME}" \
              -f target_commitish="${GITHUB_SHA}" \
              -f name="Runbox ${GITHUB_REF_NAME}" \
              -f body="$release_body" \
              -F draft=true \
              -F prerelease=false \
              --jq '.id')"
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS Apple Silicon
            os: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macOS Intel
            os: macos-15-intel
            args: --target x86_64-apple-darwin
          - platform: Windows
            os: windows-latest
            args: ""

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tauriScript: pnpm tauri
          releaseId: ${{ needs.create-release.outputs.release_id }}
          releaseDraft: true
          args: ${{ matrix.args }}

  build-cli:
    name: Build CLI ${{ matrix.platform }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS Apple Silicon
            os: macos-latest
            archive: runbox-cli-aarch64.tar.gz
          - platform: macOS Intel
            os: macos-15-intel
            archive: runbox-cli-x64.tar.gz
          - platform: Windows
            os: windows-latest
            archive: runbox-cli-x64.zip

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build CLI
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --bin p --features cli

      - name: Package CLI on macOS
        if: runner.os != 'Windows'
        run: |
          mkdir -p release-cli
          cp target/release/p release-cli/p
          tar -czf "${{ matrix.archive }}" -C release-cli p

      - name: Package CLI on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-cli | Out-Null
          Copy-Item target/release/p.exe release-cli/p.exe
          Compress-Archive -Path release-cli/p.exe -DestinationPath "${{ matrix.archive }}"

      - name: Upload CLI to GitHub Release on macOS
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "${{ matrix.archive }}" --repo "${GITHUB_REPOSITORY}" --clobber

      - name: Upload CLI to GitHub Release on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:GITHUB_REF_NAME" "${{ matrix.archive }}" --repo "$env:GITHUB_REPOSITORY" --clobber

  publish:
    name: Publish release
    needs: [build, build-cli]
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false
